<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فانوس طلایی ادگی</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOxvYXy03Cq-saW3tinDwLLZRXNc--Fos",
      authDomain: "fanous-talaei.firebaseapp.com",
      projectId: "fanous-talaei",
      storageBucket: "fanous-talaei.firebasestorage.app",
      messagingSenderId: "1022498568704",
      appId: "1:1022498568704:web:b4f3d8f75ff653d426b6e5",
      measurementId: "G-KWHKHYLR5Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ========== Global State ==========
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    let currentUser = null;

    // ========== Load Products ==========
    async function loadProducts() {
      const snapshot = await getDocs(collection(db, "products"));
      allProducts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      updateCartCount();
    }

    // ========== Render Products ==========
    function renderProducts(list) {
      const container = document.getElementById("products-container");
      if (!list || list.length === 0) {
        container.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#aaa;padding:40px 0">محصولی یافت نشد</p>`;
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="product" onclick="openProduct('${p.id}')">
          <div class="product-image">${p.image || "🔌"}</div>
          <div class="product-info">
            <div class="product-category">${p.category || ""}</div>
            <h3>${p.name}</h3>
            <div class="product-description">${p.description || ""}</div>
            <div class="product-bottom">
              <div class="price">${p.price} تومان</div>
              <div class="availability">${p.stock > 0 ? "موجود" : "ناموجود"}</div>
            </div>
          </div>
        </div>
      `).join("");
    }

    // ========== Categories ==========
    window.filterCategory = function(cat) {
      const filtered = allProducts.filter(p => p.category === cat);
      renderProducts(filtered);
      document.getElementById("products").scrollIntoView({ behavior: "smooth" });
    };

    window.showAllProducts = function() {
      renderProducts(allProducts);
      document.getElementById("products").scrollIntoView({ behavior: "smooth" });
    };

    // ========== Search ==========
    window.searchProducts = function() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      if (!q) {
        document.getElementById("products-container").innerHTML = "";
        return;
      }
      const filtered = allProducts.filter(p =>
        (p.name || "").toLowerCase().includes(q) ||
        (p.category || "").toLowerCase().includes(q) ||
        (p.description || "").toLowerCase().includes(q)
      );
      renderProducts(filtered);
    };

    // ========== Product Modal ==========
    window.openProduct = function(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;

      document.getElementById("modal-image").textContent = p.image || "🔌";
      document.getElementById("modal-title").textContent = p.name;
      document.getElementById("modal-desc").textContent = p.description || "";
      document.getElementById("modal-price").textContent = p.price + " تومان";
      document.getElementById("modal-stock").textContent = p.stock > 0 ? "موجود در انبار" : "ناموجود";
      document.getElementById("add-cart-btn").onclick = () => addToCart(p);
      document.getElementById("product-modal").classList.add("active");
    };

    window.closeProduct = function(e) {
      if (!e || e.target.id === "product-modal" || e.target.classList.contains("product-modal-close")) {
        document.getElementById("product-modal").classList.remove("active");
      }
    };

    // ========== Cart ==========
    function addToCart(product) {
      const existing = cart.find(i => i.id === product.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
      closeProduct({ target: { id: "product-modal" } });
      alert("محصول به سبد خرید اضافه شد");
    }

    function updateCartCount() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById("cart-count").textContent = count;
    }

    window.openCart = function() {
      const body = document.getElementById("cart-body");
      if (cart.length === 0) {
        body.innerHTML = "<p style='text-align:center;color:#aaa;padding:30px 0'>سبد خرید خالی است</p>";
      } else {
        let total = 0;
        body.innerHTML = cart.map((item, idx) => {
          const priceNum = parseInt((item.price || "0").replace(/,/g, "").replace(/[^\d]/g, "")) || 0;
          total += priceNum * item.qty;
          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #333">
              <div>
                <div style="font-weight:bold">${item.name}</div>
                <div style="font-size:13px;color:#aaa">${item.price} × ${item.qty}</div>
              </div>
              <button onclick="removeFromCart(${idx})" style="background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:18px">×</button>
            </div>
          `;
        }).join("") + `
          <div style="margin-top:20px;font-size:18px;font-weight:bold;color:var(--gold-light)">
            جمع کل: ${total.toLocaleString("fa-IR")} تومان
          </div>
          <button onclick="openCheckout()" style="width:100%;margin-top:20px;padding:14px;background:var(--gold);border:none;border-radius:5px;font-weight:bold;cursor:pointer">
            ثبت سفارش
          </button>
        `;
      }
      document.getElementById("cart-modal").classList.add("active");
    };

    window.removeFromCart = function(idx) {
      cart.splice(idx, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
      openCart();
    };

    window.closeCart = function(e) {
      if (!e || e.target.id === "cart-modal") {
        document.getElementById("cart-modal").classList.remove("active");
      }
    };

    // ========== Checkout ==========
    window.openCheckout = function() {
      document.getElementById("cart-modal").classList.remove("active");
      document.getElementById("checkout-modal").classList.add("active");
    };

    window.closeCheckout = function(e) {
      if (!e || e.target.id === "checkout-modal") {
        document.getElementById("checkout-modal").classList.remove("active");
      }
    };

    window.submitOrder = async function() {
      const name = document.getElementById("order-name").value.trim();
      const phone = document.getElementById("order-phone").value.trim();
      const address = document.getElementById("order-address").value.trim();
      const postal = document.getElementById("order-postal").value.trim();
      const note = document.getElementById("order-note").value.trim();

      if (!name || !phone || !address) {
        alert("لطفاً نام، تلفن و آدرس را پر کنید");
        return;
      }

      const order = {
        customerName: name,
        customerPhone: phone,
        address: address,
        postalCode: postal,
        note: note,
        items: cart,
        status: "جدید",
        createdAt: new Date().toISOString(),
        total: cart.reduce((s, i) => {
          const p = parseInt((i.price || "0").replace(/,/g, "").replace(/[^\d]/g, "")) || 0;
          return s + p * i.qty;
        }, 0)
      };

      try {
        await addDoc(collection(db, "orders"), order);
        cart = [];
        localStorage.setItem("cart", "[]");
        updateCartCount();
        document.getElementById("checkout-modal").classList.remove("active");
        document.getElementById("success-modal").classList.add("active");
      } catch (err) {
        console.error(err);
        alert("خطا در ثبت سفارش. دوباره تلاش کنید.");
      }
    };

    window.closeSuccess = function() {
      document.getElementById("success-modal").classList.remove("active");
    };

    // ========== Admin ==========
    window.openAdminLogin = function() {
      document.getElementById("admin-login-modal").classList.add("active");
    };

    window.closeAdminLogin = function(e) {
      if (!e || e.target.id === "admin-login-modal") {
        document.getElementById("admin-login-modal").classList.remove("active");
      }
    };

    window.adminLogin = async function() {
      const email = document.getElementById("admin-email").value.trim();
      const pass = document.getElementById("admin-pass").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        document.getElementById("admin-login-modal").classList.remove("active");
        openAdminPanel();
      } catch (err) {
        alert("ایمیل یا رمز اشتباه است");
      }
    };

    function openAdminPanel() {
      document.getElementById("admin-panel").classList.add("active");
      loadAdminOrders();
      loadAdminProducts();
    }

    window.closeAdminPanel = function() {
      document.getElementById("admin-panel").classList.remove("active");
    };

    window.adminLogout = async function() {
      await signOut(auth);
      closeAdminPanel();
    };

    async function loadAdminOrders() {
      const snapshot = await getDocs(collection(db, "orders"));
      const orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      const container = document.getElementById("admin-orders");
      if (orders.length === 0) {
        container.innerHTML = "<p style='color:#aaa'>سفارشی وجود ندارد</p>";
        return;
      }
      container.innerHTML = orders.map(o => `
        <div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:15px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <strong>${o.customerName}</strong>
            <span style="color:\( {o.status === 'ارسال شده' ? '#9fdb75' : '#f1cf58'}"> \){o.status}</span>
          </div>
          <div style="font-size:13px;color:#aaa;margin-bottom:6px">${o.customerPhone}</div>
          <div style="font-size:13px;color:#ccc;margin-bottom:8px">${o.address} - کدپستی: ${o.postalCode || '-'}</div>
          <div style="font-size:12px;color:#888;margin-bottom:10px">
            ${o.items.map(i => i.name + ' × ' + i.qty).join(' | ')}
          </div>
          \( {o.status !== 'ارسال شده' ? `<button onclick="markShipped(' \){o.id}')" style="padding:6px 14px;background:#d6a928;border:none;border-radius:4px;cursor:pointer;font-size:12px">علامت به عنوان ارسال شده</button>` : ''}
        </div>
      `).join("");
    }

    window.markShipped = async function(id) {
      await updateDoc(doc(db, "orders", id), { status: "ارسال شده" });
      loadAdminOrders();
    };

    async function loadAdminProducts() {
      const container = document.getElementById("admin-products");
      container.innerHTML = allProducts.map(p => `
        <div style="background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:bold">${p.name}</div>
            <div style="font-size:12px;color:#aaa">${p.price} | موجودی: ${p.stock}</div>
          </div>
        </div>
      `).join("") || "<p style='color:#aaa'>محصولی وجود ندارد</p>";
    }

    // ========== Init ==========
    onAuthStateChanged(auth, user => {
      currentUser = user;
    });

    loadProducts().then(() => {
      // Products are hidden by default - only show on category/search
      document.getElementById("products-container").innerHTML = `
        <p style="grid-column:1/-1;text-align:center;color:#aaa;padding:50px 0">
          برای مشاهده محصولات، روی یکی از دسته‌بندی‌ها کلیک کنید یا جستجو کنید
        </p>
      `;
    });

    // Make functions global
    window.addToCart = addToCart;
  </script>
